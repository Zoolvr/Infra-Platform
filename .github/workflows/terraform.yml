nom : Terraform CI

sur:
pousser:
branches : [principale]
chemins :
- 'terraform/**'
demande de fusion :
branches : [principale]
chemins :
- 'terraform/**'
workflow_dispatch :

emplois :
terraformer :
fonctionne sous : ubuntu-latest
valeurs par défaut :
courir:
répertoire de travail : terraform

mesures:
- nom : Code de paiement
utilisations : actions/checkout@v4

- nom : Configuration de Terraform
utilise : hashicorp/setup-terraform@v3

- nom : Vérification du format Terraform
exécuter : terraform fmt -check

- nom : Initialisation Terraform
Exécuter : initialisation de Terraform

- nom : Validation Terraform
Exécuter : terraform validate

- Nom : Plan Terraform
exécuter : plan Terraform
environnement :
AWS_ACCESS_KEY_ID : ${{ secrets.AWS_ACCESS_KEY_ID }}
AWS_SECRET_ACCESS_KEY : ${{ secrets.AWS_SECRET_ACCESS_KEY }}